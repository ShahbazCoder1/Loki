parser_id: fortinet_v1.0
version: "1.0"
device_family: Fortinet
description: "Fortinet FortiGate firewall log parser"

detection:
  signatures:
    - "devname=FGT"
    - "logid="
  structure: "key_value"
  keywords:
    - "type=traffic"
    - "subtype=forward"
    - "action="

extraction_rules:
  - field: "date"
    regex: "\\bdate=([^\\s]+)"
  - field: "time"
    regex: "\\btime=([^\\s]+)"
  - field: "devname"
    regex: "\\bdevname=([^\\s]+)"
  - field: "logid"
    regex: "\\blogid=([^\\s]+)"
  - field: "type"
    regex: "\\btype=([^\\s]+)"
  - field: "subtype"
    regex: "\\bsubtype=([^\\s]+)"
  - field: "level"
    regex: "\\blevel=([^\\s]+)"
  - field: "action"
    regex: "\\baction=([^\\s]+)"
  - field: "srcip"
    regex: "\\bsrcip=([^\\s]+)"
  - field: "dstip"
    regex: "\\bdstip=([^\\s]+)"
  - field: "srcport"
    regex: "\\bsrcport=(\\d+)"
  - field: "dstport"
    regex: "\\bdstport=(\\d+)"
  - field: "proto"
    regex: "\\bproto=(\\d+)"
  - field: "duration"
    regex: "\\bduration=(\\d+)"
  - field: "sentbyte"
    regex: "\\bsentbyte=(\\d+)"
  - field: "rcvdbyte"
    regex: "\\brcvdbyte=(\\d+)"
  - field: "msg"
    regex: "\\bmsg=\"?([^\"\\r\\n]+)\"?"

required_fields:
  - "srcip"
  - "dstip"
  - "action"
  - "type"

normalization_mapping:
  srcip: "src_endpoint.ip"
  dstip: "dst_endpoint.ip"
  srcport: "src_endpoint.port"
  dstport: "dst_endpoint.port"
  action: "action"
  proto: "protocol"
  type: "event_class"
  subtype: "event_type"
  level: "severity_label"
  logid: "extensions.vendor_fortinet.logid"
  devname: "extensions.vendor_fortinet.devname"
