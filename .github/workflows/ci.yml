name: Loki CI - Automated Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Unit, Corpus & Integration Tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Create fallback .env
        run: |
          echo "ELASTICSEARCH_URL=http://localhost:9200" > .env
          echo "ULPF_LOG_API_URL=http://localhost:3000/api/logs" >> .env
          echo "ULPF_SERVER_URL=http://localhost:3000" >> .env
          echo "ULPF_API_URL=http://localhost:3000" >> .env

      - name: Run Test Suite
        run: npm test
