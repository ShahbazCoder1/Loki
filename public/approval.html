<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ULPF - Parser Intelligence Console</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-base: #212121;
      --bg-surface: #171717;
      --bg-surface-secondary: #1f1f1f;
      --bg-surface-hover: #2a2a2a;
      --bg-code: #141414;
      --border-subtle: #303030;
      --border-muted: #3a3a3a;
      --text-primary: #ececec;
      --text-secondary: #b4b4b4;
      --text-muted: #8a8a8a;
      --status-valid-text: #d0d0d0;
      --status-review-text: #d0b878;
      --status-fail-text: #d6a06a;
      --font-sans: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-base);
      color: var(--text-primary);
      font-family: var(--font-sans);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    header {
      background-color: var(--bg-surface);
      border-bottom: 1px solid var(--border-subtle);
      position: sticky;
      top: 0;
      z-index: 50;
      padding: 0.85rem 2rem;
    }

    .nav-container {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .brand-logo {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      background: var(--bg-surface-secondary);
      border: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 0.85rem;
      color: var(--text-primary);
    }

    .brand-title {
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--text-primary);
      letter-spacing: -0.01em;
    }

    .brand-subtitle {
      font-size: 0.78rem;
      color: var(--text-muted);
      font-weight: 400;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      padding: 0.45rem 0.85rem;
      border-radius: 6px;
      font-size: 0.82rem;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease;
      border: 1px solid transparent;
      text-decoration: none;
      user-select: none;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-primary,
    .btn-secondary {
      background-color: var(--bg-surface-secondary);
      color: var(--text-primary);
      border: 1px solid var(--border-muted);
    }

    .btn-primary:hover:not(:disabled),
    .btn-secondary:hover:not(:disabled) {
      background-color: var(--bg-surface-hover);
      border-color: #444444;
    }

    .btn-success {
      background-color: #2a2a2a;
      color: var(--text-primary);
      border: 1px solid var(--border-muted);
      font-weight: 500;
    }

    .btn-success:hover:not(:disabled) {
      background-color: #232d26;
      border-color: #354a39;
      color: #e4f2e7;
    }

    .btn-danger {
      background-color: #242424;
      color: #c8c8c8;
      border: 1px solid var(--border-muted);
      font-weight: 500;
    }

    .btn-danger:hover:not(:disabled) {
      background-color: #2c2223;
      border-color: #4a3335;
      color: #f0c8c9;
    }

    main {
      flex: 1;
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
      padding: 1.75rem 2rem;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }

    .kpi-card {
      background-color: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 0.85rem 1.1rem;
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
    }

    .kpi-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .kpi-value {
      font-size: 1.25rem;
      font-weight: 600;
      font-family: var(--font-mono);
      color: var(--text-primary);
    }

    .section-heading {
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .alert {
      padding: 0.85rem 1.15rem;
      border-radius: 6px;
      margin-bottom: 1.25rem;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-size: 0.85rem;
    }

    .alert-error {
      background: #282121;
      border: 1px solid #4a3335;
      color: #f0c8c9;
    }

    /* COMPACT CANDIDATE LIST ROW */
    .candidate-row {
      background-color: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 1rem 1.25rem;
      margin-bottom: 0.85rem;
      transition: border-color 0.15s ease, background-color 0.15s ease;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .candidate-row:hover {
      border-color: var(--border-muted);
    }

    .candidate-row-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.75rem;
    }

    .candidate-row-title {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      flex-wrap: wrap;
    }

    .candidate-id {
      font-family: var(--font-mono);
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-primary);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      padding: 0.2rem 0.55rem;
      border-radius: 4px;
      font-size: 0.72rem;
      font-weight: 500;
    }

    .badge-meta {
      background: var(--bg-surface-secondary);
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
    }

    .badge-pass {
      background: #242424;
      border: 1px solid #3a3a3a;
      color: var(--status-valid-text);
    }

    .badge-review {
      background: #29261f;
      border: 1px solid #4a4330;
      color: var(--status-review-text);
    }

    .badge-fail {
      background: #2a241f;
      border: 1px solid #4a392b;
      color: var(--status-fail-text);
    }

    .meta-timeline {
      font-size: 0.78rem;
      color: var(--text-muted);
      display: flex;
      gap: 1rem;
    }

    .meta-timeline strong {
      color: var(--text-secondary);
      font-weight: 500;
    }

    .candidate-row-body {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
      border-top: 1px solid #222222;
      padding-top: 0.75rem;
    }

    .candidate-summary-stats {
      display: flex;
      align-items: center;
      gap: 1.5rem;
      flex-wrap: wrap;
    }

    .stat-item {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.8rem;
    }

    .stat-label {
      color: var(--text-muted);
    }

    .stat-value {
      color: var(--text-primary);
      font-weight: 500;
    }

    .text-pass {
      color: var(--status-valid-text);
    }

    .text-review {
      color: var(--status-review-text);
    }

    .text-fail {
      color: var(--status-fail-text);
    }

    .font-mono {
      font-family: var(--font-mono);
    }

    /* DETAILS VIEW STYLING */
    .details-nav {
      margin-bottom: 1.25rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .candidate-card {
      background-color: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      margin-bottom: 1.5rem;
      overflow: hidden;
    }

    .card-header {
      padding: 1rem 1.25rem;
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.75rem;
    }

    .card-title-group {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      flex-wrap: wrap;
    }

    .decision-banner {
      padding: 0.75rem 1.25rem;
      border-radius: 6px;
      border: 1px solid;
      margin: 1rem 1.25rem 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .decision-banner.status-ready {
      background: #1e1e1e;
      border-color: #333333;
      color: var(--status-valid-text);
    }

    .decision-banner.status-review {
      background: #24201a;
      border-color: #3d3527;
      color: var(--status-review-text);
    }

    .decision-banner.status-blocked {
      background: #26201b;
      border-color: #3d3026;
      color: var(--status-fail-text);
    }

    .card-body {
      padding: 1.25rem;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }

    @media (max-width: 850px) {
      .card-body {
        grid-template-columns: 1fr;
      }
    }

    .info-box {
      background-color: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 6px;
      padding: 0.9rem 1rem;
    }

    .info-title {
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 0.65rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .loki-log-stream {
      background-color: var(--bg-code);
      border: 1px solid var(--border-subtle);
      border-radius: 6px;
      font-family: var(--font-mono);
      font-size: 0.75rem;
      overflow-x: auto;
      max-height: 200px;
      padding: 0.6rem 0.75rem;
      color: var(--text-secondary);
      line-height: 1.6;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      padding: 0.15rem 0.45rem;
      border-radius: 3px;
      font-family: var(--font-mono);
      font-size: 0.72rem;
      white-space: nowrap;
      background: var(--bg-surface-secondary);
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
    }

    .fields-list {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
    }

    .field-pill {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      background: var(--bg-surface-secondary);
      color: var(--text-secondary);
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      border: 1px solid var(--border-subtle);
    }

    .field-pill.req {
      border-color: #4a4330;
      color: var(--status-review-text);
      background: #24201a;
    }

    .test-meter {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.45rem 0;
      font-size: 0.82rem;
      color: var(--text-secondary);
      border-bottom: 1px solid #222222;
    }

    .test-meter:last-child {
      border-bottom: none;
    }

    .full-width {
      grid-column: 1 / -1;
    }

    .code-preview {
      font-family: var(--font-mono);
      font-size: 0.78rem;
      background-color: var(--bg-code);
      border: 1px solid var(--border-subtle);
      border-radius: 6px;
      padding: 0.75rem;
      overflow-x: auto;
      white-space: pre-wrap;
      word-break: break-all;
      color: var(--text-primary);
      max-height: 180px;
    }

    .card-footer {
      padding: 0.85rem 1.25rem;
      background: transparent;
      border-top: 1px solid var(--border-subtle);
      display: flex;
      justify-content: flex-end;
      gap: 0.6rem;
    }

    .empty-state {
      text-align: center;
      padding: 3.5rem 2rem;
      background-color: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
    }

    .empty-title {
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 0.4rem;
    }

    .empty-desc {
      font-size: 0.82rem;
      color: var(--text-secondary);
      max-width: 460px;
      margin: 0 auto 1.25rem;
      line-height: 1.5;
    }

    .toast-container {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 100;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    .toast {
      padding: 0.75rem 1.15rem;
      border-radius: 6px;
      font-size: 0.82rem;
      font-weight: 500;
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
      animation: slideIn 0.2s ease-out;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    @keyframes slideIn {
      from { transform: translateX(100%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }

    .toast-success { background: #1f2420; color: #d4e8d9; border: 1px solid #313d33; }
    .toast-error { background: #282121; color: #f0c8c9; border: 1px solid #4a3335; }
    .toast-info { background: #1f1f1f; color: var(--text-primary); border: 1px solid #383838; }
  </style>
</head>
<body>

  <header>
    <div class="nav-container">
      <div class="brand">
        <div class="brand-logo">U</div>
        <div>
          <div style="font-size:0.7rem; color:var(--text-muted); font-family:var(--font-mono); font-weight:500; text-transform:uppercase; letter-spacing:0.04em;">ULPF / Intelligence / Parser Approval</div>
          <div class="brand-title">Parser Intelligence Console</div>
          <div class="brand-subtitle">Human review and activation of AI-generated parser candidates</div>
        </div>
      </div>
      <div class="header-actions">
        <button id="refresh-btn" class="btn btn-secondary" onclick="loadCandidates()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg>
          Refresh Candidates
        </button>
        <button id="generate-btn" class="btn btn-primary" onclick="triggerAIGeneration()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg>
          Run AI Analysis
        </button>
      </div>
    </div>
  </header>

  <main>
    <!-- 1. MAIN CANDIDATE LIST VIEW -->
    <div id="list-view">
      <div id="summary-bar" class="summary-grid"></div>
      <div class="section-heading">Pending Parser Candidates</div>
      <div id="candidates-list">
        <!-- Dynamic Candidate List Rows -->
      </div>
    </div>

    <!-- 2. DEDICATED DETAILS / INSPECTION VIEW -->
    <div id="details-view" style="display: none;">
      <div class="details-nav">
        <button class="btn btn-secondary" onclick="showListView()">
          &larr; Back to Candidates
        </button>
      </div>
      <div id="details-content-container">
        <!-- Dynamic Full Candidate Details -->
      </div>
    </div>
  </main>

  <div id="toast-container" class="toast-container"></div>

  <script>
    let cachedCandidates = [];

    function showToast(message, type = "info") {
      const container = document.getElementById("toast-container");
      const toast = document.createElement("div");
      toast.className = `toast toast-${type}`;
      toast.textContent = message;
      container.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateX(100%)';
        toast.style.transition = 'all 0.3s ease';
        setTimeout(() => toast.remove(), 300);
      }, 3500);
    }

    function showListView() {
      document.getElementById("details-view").style.display = "none";
      document.getElementById("list-view").style.display = "block";
    }

    function showDetailsView(candidateId) {
      const item = cachedCandidates.find(c => c.candidate_id === candidateId);
      if (!item) {
        showToast("Candidate not found", "error");
        return;
      }
      renderCandidateDetails(item);
      document.getElementById("list-view").style.display = "none";
      document.getElementById("details-view").style.display = "block";
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    async function loadCandidates() {
      const container = document.getElementById("candidates-list");
      const summaryBar = document.getElementById("summary-bar");
      container.innerHTML = `<div style="text-align:center; padding: 3rem; color: var(--text-muted); font-size: 0.88rem;">Loading parser candidates...</div>`;

      try {
        const res = await fetch("/api/intelligence/candidates");
        if (!res.ok) throw new Error("Failed to fetch candidates");
        const data = await res.json();
        cachedCandidates = data.candidates || [];

        if (summaryBar) {
          if (cachedCandidates.length === 0) {
            summaryBar.innerHTML = "";
          } else {
            const totalEvents = cachedCandidates.reduce((acc, i) => acc + (i.cluster_size || 0), 0);
            const passedCount = cachedCandidates.filter(i => i.test_results?.overall_pass).length;
            summaryBar.innerHTML = `
              <div class="kpi-card">
                <div class="kpi-label">Pending Candidates</div>
                <div class="kpi-value">${cachedCandidates.length}</div>
              </div>
              <div class="kpi-card">
                <div class="kpi-label">Quarantined Events</div>
                <div class="kpi-value">${totalEvents}</div>
              </div>
              <div class="kpi-card">
                <div class="kpi-label">Clusters</div>
                <div class="kpi-value">${cachedCandidates.length}</div>
              </div>
              <div class="kpi-card">
                <div class="kpi-label">Validation Status</div>
                <div class="kpi-value">${passedCount} / ${cachedCandidates.length}</div>
              </div>
            `;
          }
        }

        if (cachedCandidates.length === 0) {
          container.innerHTML = `
            <div class="empty-state">
              <div class="empty-title">No Pending Candidates</div>
              <div class="empty-desc">All unknown logs have been resolved or no new clusters require parser onboarding. Click "Run AI Analysis" to inspect current quarantine logs.</div>
              <button class="btn btn-secondary" onclick="triggerAIGeneration()">Run AI Analysis</button>
            </div>
          `;
          showListView();
          return;
        }

        renderCandidateList(cachedCandidates);
      } catch (err) {
        container.innerHTML = `
          <div class="alert alert-error">
            <span>Failed to load candidates: ${escapeHtml(err.message)}</span>
          </div>
        `;
      }
    }

    function renderCandidateList(candidates) {
      const container = document.getElementById("candidates-list");
      container.innerHTML = "";

      candidates.forEach(item => {
        const c = item.candidate || {};
        const testRes = item.test_results || { positive: { passed: 0, total: 0 }, negative: { correctly_rejected: 0, total: 0 } };

        let statusText = "Needs Review";
        let statusBadgeClass = "badge-review";
        let statusTextClass = "text-review";

        if (testRes.overall_pass === true) {
          statusText = "Validated";
          statusBadgeClass = "badge-pass";
          statusTextClass = "text-pass";
        } else if (testRes.overall_pass === false && testRes.positive?.passed === 0) {
          statusText = "Validation Failed";
          statusBadgeClass = "badge-fail";
          statusTextClass = "text-fail";
        }

        const row = document.createElement("div");
        row.className = "candidate-row";
        row.id = `row-${item.candidate_id}`;

        row.innerHTML = `
          <div class="candidate-row-header">
            <div class="candidate-row-title">
              <span class="candidate-id">${escapeHtml(c.parser_id || item.candidate_id)}</span>
              <span class="badge badge-meta">${escapeHtml(item.device_family || c.device_family || "AI Suggested")}</span>
              <span class="badge badge-meta">Cluster: ${item.cluster_size || 1} Event${item.cluster_size === 1 ? '' : 's'}</span>
              <span class="badge ${statusBadgeClass}">${statusText}</span>
            </div>
            <div class="meta-timeline">
              <span><strong>First Seen:</strong> ${escapeHtml(new Date(item.first_seen || Date.now()).toLocaleTimeString())}</span>
              <span><strong>Last Seen:</strong> ${escapeHtml(new Date(item.last_seen || Date.now()).toLocaleTimeString())}</span>
            </div>
          </div>

          <div class="candidate-row-body">
            <div class="candidate-summary-stats">
              <div class="stat-item">
                <span class="stat-label">Validation:</span>
                <span class="stat-value ${statusTextClass}">${statusText}</span>
              </div>
              <div class="stat-item">
                <span class="stat-label">Positive:</span>
                <span class="stat-value font-mono">${testRes.positive?.passed || 0}/${testRes.positive?.total || 0} passed</span>
              </div>
              <div class="stat-item">
                <span class="stat-label">Negative:</span>
                <span class="stat-value font-mono">${testRes.negative?.correctly_rejected || 0}/${testRes.negative?.total || 0} rejected</span>
              </div>
            </div>
            <div>
              <button class="btn btn-secondary" onclick="showDetailsView('${item.candidate_id}')">
                View Details &rarr;
              </button>
            </div>
          </div>
        `;

        container.appendChild(row);
      });
    }

    function renderCandidateDetails(item) {
      const container = document.getElementById("details-content-container");
      const c = item.candidate || {};
      const testRes = item.test_results || { positive: { passed: 0, total: 0 }, negative: { correctly_rejected: 0, total: 0 } };
      const signatures = c.detection?.signatures || [];
      const rules = c.extraction_rules || [];
      const required = c.required_fields || [];
      const samples = c.samples || item.samples || [];
      const sampleRaw = samples[0] || "Sample log raw data";

      let statusClass = "status-review";
      let statusBadgeClass = "badge-review";
      let statusTitle = "REVIEW REQUIRED";
      let statusDesc = "Candidate passed partial tests. Review evidence before approval.";

      if (testRes.overall_pass === true) {
        statusClass = "status-ready";
        statusBadgeClass = "badge-pass";
        statusTitle = "READY FOR HUMAN APPROVAL";
        statusDesc = "All automated validation tests passed. Safe to activate.";
      } else if (testRes.overall_pass === false && testRes.positive?.passed === 0) {
        statusClass = "status-blocked";
        statusBadgeClass = "badge-fail";
        statusTitle = "BLOCKED — VALIDATION FAILED";
        statusDesc = "Automated test suite reported validation failures.";
      }

      container.innerHTML = `
        <div class="candidate-card" id="card-${item.candidate_id}">
          <div class="card-header">
            <div class="card-title-group">
              <span class="candidate-id">${escapeHtml(c.parser_id || item.candidate_id)}</span>
              <span class="badge badge-meta">${escapeHtml(item.device_family || c.device_family || "AI Suggested")}</span>
              <span class="badge badge-meta">Cluster: ${item.cluster_size || 1} Event${item.cluster_size === 1 ? '' : 's'}</span>
              <span class="badge ${statusBadgeClass}">${testRes.overall_pass ? 'Validated' : (testRes.positive?.passed === 0 && testRes.overall_pass === false ? 'Validation Failed' : 'Needs Review')}</span>
            </div>
            <div class="meta-timeline">
              <span><strong>First Seen:</strong> ${escapeHtml(new Date(item.first_seen || Date.now()).toLocaleTimeString())}</span>
              <span><strong>Last Seen:</strong> ${escapeHtml(new Date(item.last_seen || Date.now()).toLocaleTimeString())}</span>
            </div>
          </div>

          <!-- DECISION STATUS BANNER -->
          <div class="decision-banner ${statusClass}">
            <div>
              <div style="font-weight: 600; font-size: 0.88rem;">${statusTitle}</div>
              <div style="font-size: 0.78rem; color: var(--text-secondary); margin-top:0.15rem;">
                ${statusDesc}
                <span style="display:inline-block; margin-left:0.5rem; color:var(--text-muted); font-family:var(--font-mono); font-size:0.75rem;">
                  [${testRes.positive?.passed || 0}/${testRes.positive?.total || 0} positive passed &bull; ${testRes.negative?.correctly_rejected || 0}/${testRes.negative?.total || 0} negative rejected]
                </span>
              </div>
            </div>
            <span class="badge ${statusBadgeClass}">
              ${testRes.positive?.passed || 0} / ${testRes.positive?.total || 0} Positive Passed
            </span>
          </div>

          <div class="card-body">
            <!-- 1. QUARANTINED LOG EVIDENCE -->
            <div class="info-box full-width">
              <div class="info-title">
                <span>Quarantined Log Evidence</span>
                <span style="font-size:0.72rem; color:var(--text-muted); font-family:var(--font-mono);">${samples.length} Log Sample(s)</span>
              </div>
              <div style="display:flex; gap:0.4rem; margin-bottom:0.6rem; flex-wrap:wrap;">
                <span class="chip">cluster: ${escapeHtml(item.cluster_id || "cluster")}</span>
                <span class="chip">family: ${escapeHtml(item.device_family || "unknown")}</span>
                <span class="chip">status: quarantined</span>
              </div>
              <div class="loki-log-stream">
                ${samples.slice(0, 5).map((s, i) => `
                  <div style="display:flex; gap:0.6rem; padding:0.25rem 0; border-bottom:1px solid #222222;">
                    <span style="color:var(--text-muted); user-select:none;">#${i + 1}</span>
                    <span style="white-space:pre-wrap; word-break:break-all;">${escapeHtml(s)}</span>
                  </div>
                `).join('') || '<div>No log samples available</div>'}
              </div>
            </div>

            <!-- 2. DETECTION — SIGNATURES & STRUCTURE -->
            <div class="info-box">
              <div class="info-title">Detection &mdash; Proposed Signatures</div>
              <div class="code-preview" style="max-height:100px;">${signatures.map(s => `"${escapeHtml(s)}"`).join("\n") || '<span style="color:var(--text-muted)">None</span>'}</div>
              <div style="margin-top: 0.75rem;" class="info-title">Structure</div>
              <div style="font-family: var(--font-mono); font-size: 0.8rem; color: var(--text-secondary);">
                ${escapeHtml(c.detection?.structure || "syslog_text")}
              </div>
            </div>

            <!-- 3. VALIDATION DETAILS — TEST SCORECARD -->
            <div class="info-box">
              <div class="info-title">Validation Details &mdash; Test Scorecard</div>
              <div class="test-meter">
                <span>Positive Match (Cluster logs):</span>
                <strong>${testRes.positive?.passed || 0} / ${testRes.positive?.total || 0} passed</strong>
              </div>
              <div class="test-meter">
                <span>Negative Test (Non-matching logs):</span>
                <strong>${testRes.negative?.correctly_rejected || 0} / ${testRes.negative?.total || 0} rejected</strong>
              </div>
              <div class="test-meter">
                <span>Overall Pass Status:</span>
                <strong class="${testRes.overall_pass ? 'text-pass' : 'text-review'}">${testRes.overall_pass ? 'PASS' : 'PARTIAL'}</strong>
              </div>
              ${testRes.positive?.total ? `
                <div class="test-meter">
                  <span>Match Rate:</span>
                  <strong>${((testRes.positive.passed / testRes.positive.total) * 100).toFixed(0)}%</strong>
                </div>
              ` : ''}
            </div>

            <!-- 4. FIELD EXTRACTION — PROPOSED FIELDS & NORMALIZATION -->
            <div class="info-box full-width">
              <div class="info-title">Field Extraction &mdash; Proposed Fields & Normalization</div>
              <div class="fields-list">
                ${rules.map(r => `
                  <span class="field-pill ${required.includes(r.field) ? 'req' : ''}">
                    ${escapeHtml(r.field)} &rarr; ${escapeHtml(c.normalization_mapping?.[r.field] || r.field)}
                    ${required.includes(r.field) ? ' <small style="color:var(--status-review-text)">(REQ)</small>' : ''}
                  </span>
                `).join("")}
              </div>
            </div>

            <!-- 5. RAW → PARSED / NORMALIZED PREVIEW -->
            <div class="info-box full-width">
              <div class="info-title">Raw &rarr; Parsed / Normalized Preview</div>
              <div style="display:grid; grid-template-columns: 1fr 1fr; gap:0.75rem;">
                <div>
                  <div style="font-size:0.72rem; color:var(--text-muted); text-transform:uppercase; margin-bottom:0.3rem; font-weight:600;">Raw Log</div>
                  <div class="code-preview" style="max-height:140px;">${escapeHtml(sampleRaw)}</div>
                </div>
                <div>
                  <div style="font-size:0.72rem; color:var(--text-muted); text-transform:uppercase; margin-bottom:0.3rem; font-weight:600;">Parsed / Normalized</div>
                  <div class="code-preview" style="max-height:140px;">${escapeHtml(JSON.stringify(c.normalization_mapping || {}, null, 2))}</div>
                </div>
              </div>
            </div>

            <!-- 6. APPROVAL IMPACT -->
            <div class="info-box full-width">
              <div class="info-title">Approval Impact</div>
              <div style="font-size:0.8rem; color: var(--text-secondary); line-height:1.5;">
                Approving candidate <code style="font-family:var(--font-mono); color:var(--text-primary);">${escapeHtml(c.parser_id || item.candidate_id)}</code> activates the proposed parser for future matching logs in the ingestion pipeline. Quarantined events from this cluster will automatically normalize according to the target mapping schema.
              </div>
            </div>
          </div>

          <!-- ACTIONS IN DETAILS VIEW -->
          <div class="card-footer">
            <button class="btn btn-danger" onclick="rejectCandidate('${item.candidate_id}')">
              Reject
            </button>
            <button class="btn btn-success" onclick="approveCandidate('${item.candidate_id}')">
              Approve & Activate
            </button>
          </div>
        </div>
      `;
    }

    async function approveCandidate(candidateId) {
      try {
        const res = await fetch("/api/intelligence/approve", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ candidate_id: candidateId })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Approval failed");

        showToast(`Parser '${data.parser_id}' approved & activated! Hot-reload completed.`, "success");
        showListView();
        await loadCandidates();
      } catch (err) {
        showToast(`Approval error: ${err.message}`, "error");
      }
    }

    async function rejectCandidate(candidateId) {
      if (!confirm(`Are you sure you want to reject candidate '${candidateId}'?`)) return;
      try {
        const res = await fetch("/api/intelligence/reject", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ candidate_id: candidateId })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Rejection failed");

        showToast(`Candidate '${candidateId}' rejected.`, "info");
        showListView();
        await loadCandidates();
      } catch (err) {
        showToast(`Rejection error: ${err.message}`, "error");
      }
    }

    async function triggerAIGeneration() {
      const btn = document.getElementById("generate-btn");
      btn.disabled = true;
      btn.innerHTML = `Analyzing...`;
      showToast("Triggering AI analysis of quarantined clusters...", "info");

      try {
        const res = await fetch("/api/intelligence/generate", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({})
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Generation failed");

        showToast("New AI candidate parser generated!", "success");
        await loadCandidates();
      } catch (err) {
        showToast(`Analysis error: ${err.message}`, "error");
      } finally {
        btn.disabled = false;
        btn.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg> Run AI Analysis`;
      }
    }

    function escapeHtml(str) {
      if (!str) return "";
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    // Load on start
    loadCandidates();
  </script>
</body>
</html>
