<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loki Event Trace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-base: #212121;
      --bg-surface: #171717;
      --bg-surface-secondary: #1f1f1f;
      --bg-surface-hover: #2a2a2a;
      --bg-code: #141414;
      --border-subtle: #303030;
      --border-muted: #3a3a3a;
      --text-primary: #ececec;
      --text-secondary: #b4b4b4;
      --text-muted: #8a8a8a;
      --status-success-bg: #1e2922;
      --status-success-border: #2e4436;
      --status-success-text: #6edc8c;
      --status-fail-bg: #2d1e1e;
      --status-fail-border: #4a2e2e;
      --status-fail-text: #f08c8c;
      --status-partial-bg: #2a261a;
      --status-partial-border: #443c24;
      --status-partial-text: #e6c875;
      --font-sans: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-base);
      color: var(--text-primary);
      font-family: var(--font-sans);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    header {
      background-color: var(--bg-surface);
      border-bottom: 1px solid var(--border-subtle);
      position: sticky;
      top: 0;
      z-index: 50;
      padding: 0.85rem 2rem;
    }

    .nav-container {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .brand-logo {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      background: var(--bg-surface-secondary);
      border: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 0.85rem;
      color: var(--text-primary);
    }

    .brand-title {
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--text-primary);
      letter-spacing: -0.01em;
    }

    .brand-subtitle {
      font-size: 0.78rem;
      color: var(--text-muted);
      font-weight: 400;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .event-id-badge {
      font-family: var(--font-mono);
      color: var(--text-primary);
      background: var(--bg-surface-secondary);
      padding: 0.1rem 0.45rem;
      border-radius: 4px;
      border: 1px solid var(--border-subtle);
      font-size: 0.78rem;
    }

    main {
      flex: 1;
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
      padding: 1.75rem 2rem;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    /* Cards & Layout */
    .card {
      background-color: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      overflow: hidden;
    }

    .card-header {
      padding: 0.85rem 1.25rem;
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.75rem;
      background-color: var(--bg-surface);
    }

    .card-title {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .card-body {
      padding: 1.25rem;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.25rem;
    }

    @media (max-width: 850px) {
      .grid-2 {
        grid-template-columns: 1fr;
      }

      main {
        padding: 1rem;
      }
    }

    /* Buttons & Badges */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      padding: 0.4rem 0.75rem;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
      border: 1px solid var(--border-muted);
      background-color: var(--bg-surface-secondary);
      color: var(--text-primary);
    }

    .btn:hover:not(:disabled) {
      background-color: var(--bg-surface-hover);
      border-color: #444444;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      padding: 0.2rem 0.55rem;
      border-radius: 4px;
      font-size: 0.72rem;
      font-weight: 500;
      font-family: var(--font-mono);
    }

    .badge-success {
      background: var(--status-success-bg);
      border: 1px solid var(--status-success-border);
      color: var(--status-success-text);
    }

    .badge-fail {
      background: var(--status-fail-bg);
      border: 1px solid var(--status-fail-border);
      color: var(--status-fail-text);
    }

    .badge-partial {
      background: var(--status-partial-bg);
      border: 1px solid var(--status-partial-border);
      color: var(--status-partial-text);
    }

    .badge-neutral {
      background: var(--bg-surface-secondary);
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
    }

    /* Code & Raw Display */
    .code-box {
      background-color: var(--bg-code);
      border: 1px solid var(--border-subtle);
      border-radius: 6px;
      padding: 0.85rem 1rem;
      font-family: var(--font-mono);
      font-size: 0.82rem;
      color: var(--text-primary);
      overflow-x: auto;
      white-space: pre-wrap;
      word-break: break-all;
      line-height: 1.6;
      max-height: 240px;
    }

    mark.highlight-fragment {
      background-color: #3d341b;
      color: #ffd866;
      border-radius: 3px;
      padding: 0.1em 0.3em;
      border: 1px solid #735c24;
      font-weight: 600;
    }

    /* Provenance Timeline */
    .timeline {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      position: relative;
    }

    .timeline-item {
      flex: 1;
      min-width: 140px;
      background-color: var(--bg-surface-secondary);
      border: 1px solid var(--border-subtle);
      border-radius: 6px;
      padding: 0.75rem 0.9rem;
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
      position: relative;
    }

    .timeline-stage {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--text-primary);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .timeline-meta {
      font-size: 0.72rem;
      color: var(--text-muted);
      font-family: var(--font-mono);
    }

    .timeline-comp {
      font-size: 0.73rem;
      color: var(--text-secondary);
    }

    /* Tables */
    .data-table-container {
      overflow-x: auto;
    }

    .data-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.82rem;
      text-align: left;
    }

    .data-table th {
      background-color: var(--bg-surface-secondary);
      color: var(--text-muted);
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding: 0.65rem 0.85rem;
      border-bottom: 1px solid var(--border-subtle);
    }

    .data-table td {
      padding: 0.65rem 0.85rem;
      border-bottom: 1px solid var(--border-subtle);
      color: var(--text-primary);
      vertical-align: top;
    }

    .data-table tr.clickable {
      cursor: pointer;
      transition: background-color 0.15s ease;
    }

    .data-table tr.clickable:hover {
      background-color: var(--bg-surface-hover);
    }

    .data-table tr.selected {
      background-color: #24221b;
      outline: 1px solid #5c4d28;
    }

    .font-mono {
      font-family: var(--font-mono);
    }

    .key-val-grid {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 0.4rem 1rem;
      font-size: 0.82rem;
    }

    .key-label {
      color: var(--text-muted);
      font-weight: 500;
    }

    .val-content {
      color: var(--text-primary);
    }

    /* States */
    .state-container {
      text-align: center;
      padding: 3.5rem 2rem;
    }

    .state-title {
      font-size: 1.05rem;
      font-weight: 600;
      margin-bottom: 0.4rem;
    }

    .state-desc {
      font-size: 0.82rem;
      color: var(--text-secondary);
      max-width: 480px;
      margin: 0 auto;
    }
  </style>
</head>
<body>

  <header>
    <div class="nav-container">
      <div class="brand">
        <img class="brand-logo" src="/Loki.png" alt="Loki Logo" style="border: none; background: transparent;">
        <div>
          <div style="font-size:0.7rem; color:var(--text-muted); font-family:var(--font-mono); font-weight:500; text-transform:uppercase; letter-spacing:0.04em;">Loki / Diagnostics</div>
          <div class="brand-title">Loki Event Trace</div>
        </div>
      </div>
      <div class="brand-subtitle" id="header-meta">
        <!-- Event ID & Received At dynamically loaded -->
      </div>
    </div>
  </header>

  <main id="app-main">
    <div class="card state-container" id="loading-state">
      <div class="state-title">Loading Event Trace...</div>
      <div class="state-desc" id="loading-desc">Fetching event envelope from Loki index...</div>
    </div>
  </main>

  <script>
    let currentEventData = null;

    function escapeHtml(str) {
      if (str === null || str === undefined) return "";
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function getEventIdFromUrl() {
      const pathname = window.location.pathname;
      const parts = pathname.split("/").filter(Boolean);

      if (parts.length >= 2 && parts[0] === "trace") {
        return decodeURIComponent(parts[1]);
      }

      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get("event_id")) return urlParams.get("event_id");
      if (urlParams.get("id")) return urlParams.get("id");

      if (parts.length > 0) {
        const last = parts[parts.length - 1];
        if (last !== "trace" && last !== "trace.html") {
          return decodeURIComponent(last);
        }
      }
      return null;
    }

    function flattenObject(obj, prefix = "") {
      const result = {};
      if (!obj || typeof obj !== "object") return result;
      for (const [key, value] of Object.entries(obj)) {
        const newKey = prefix ? `${prefix}.${key}` : key;
        if (value && typeof value === "object" && !Array.isArray(value) && Object.keys(value).length > 0) {
          Object.assign(result, flattenObject(value, newKey));
        } else {
          result[newKey] = value;
        }
      }
      return result;
    }

    async function sha256Hex(str) {
      const encoder = new TextEncoder();
      const data = encoder.encode(str);
      const hashBuffer = await crypto.subtle.digest("SHA-256", data);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      return hashArray.map(b => b.toString(16).padStart(2, "0")).join("");
    }

    async function verifyIntegrity() {
      const btn = document.getElementById("verify-btn");
      const resultEl = document.getElementById("integrity-result");
      if (!currentEventData || !currentEventData.raw) return;

      if (btn) btn.disabled = true;
      if (resultEl) resultEl.innerHTML = `<span class="badge badge-neutral">Calculating hash...</span>`;

      try {
        const payload = currentEventData.raw.immutable_payload || currentEventData.raw.payload || "";
        const storedHash = (currentEventData.raw.integrity_hash || "").replace(/^sha256:/i, "").trim().toLowerCase();
        const computedHash = (await sha256Hex(payload)).toLowerCase();

        if (storedHash && storedHash === computedHash) {
          resultEl.innerHTML = `<span class="badge badge-success">Integrity Verified</span>`;
        } else if (storedHash) {
          resultEl.innerHTML = `<span class="badge badge-fail">Hash Mismatch</span> <span style="font-size:0.75rem; color:var(--text-muted); font-family:var(--font-mono);">Computed: ${escapeHtml(computedHash.slice(0, 12))}... Stored: ${escapeHtml(storedHash.slice(0, 12))}...</span>`;
        } else {
          resultEl.innerHTML = `<span class="badge badge-partial">No Stored Hash Found</span>`;
        }
      } catch (err) {
        resultEl.innerHTML = `<span class="badge badge-fail">Verification Error: ${escapeHtml(err.message)}</span>`;
      } finally {
        if (btn) btn.disabled = false;
      }
    }

    function selectLineageRow(rowEl, fragment) {
      document.querySelectorAll(".lineage-row").forEach(r => r.classList.remove("selected"));
      if (rowEl) rowEl.classList.add("selected");

      const rawCodeEl = document.getElementById("raw-log-code");
      const statusEl = document.getElementById("lineage-status");
      const payload = currentEventData?.raw?.immutable_payload || currentEventData?.raw?.payload || "";

      if (!fragment || typeof fragment !== "string") {
        if (rawCodeEl) rawCodeEl.innerHTML = escapeHtml(payload);
        if (statusEl) statusEl.innerHTML = `<span style="color:var(--text-muted)">No raw fragment associated with this field</span>`;
        return;
      }

      const index = payload.indexOf(fragment);
      if (index === -1) {
        if (rawCodeEl) rawCodeEl.innerHTML = escapeHtml(payload);
        if (statusEl) statusEl.innerHTML = `<span class="badge badge-fail">Fragment not found in raw log</span> <span class="font-mono" style="font-size:0.75rem; color:var(--text-muted)">"${escapeHtml(fragment)}"</span>`;
        return;
      }

      const before = payload.slice(0, index);
      const match = payload.slice(index, index + fragment.length);
      const after = payload.slice(index + fragment.length);

      if (rawCodeEl) {
        rawCodeEl.innerHTML = `${escapeHtml(before)}<mark class="highlight-fragment">${escapeHtml(match)}</mark>${escapeHtml(after)}`;
        const mark = rawCodeEl.querySelector("mark");
        if (mark) mark.scrollIntoView({ behavior: "smooth", block: "nearest" });
      }

      if (statusEl) {
        statusEl.innerHTML = `<span class="badge badge-success">Fragment Highlighted</span> <span class="font-mono" style="font-size:0.75rem; color:var(--text-secondary)">"${escapeHtml(fragment)}"</span>`;
      }
    }

    function renderEventTrace(event) {
      currentEventData = event;
      const main = document.getElementById("app-main");
      const headerMeta = document.getElementById("header-meta");

      const eventId = event.event_id || "Unknown ID";
      const receivedAt = event.received_at ? new Date(event.received_at).toLocaleString() : "N/A";

      headerMeta.innerHTML = `
        <span>Event ID: <span class="event-id-badge">${escapeHtml(eventId)}</span></span>
        <span>Received: <strong style="color:var(--text-secondary)">${escapeHtml(receivedAt)}</strong></span>
      `;

      // 1. Provenance Timeline
      const provenance = Array.isArray(event.provenance) ? event.provenance : [];
      let provenanceHtml = "";
      if (provenance.length === 0) {
        provenanceHtml = `<div style="color:var(--text-muted); font-size:0.82rem;">No provenance stage history recorded for this event.</div>`;
      } else {
        provenanceHtml = `
          <div class="timeline">
            ${provenance.map(p => {
              const stage = (p.stage || p.action || "STAGE").toUpperCase();
              const status = (p.status || p.outcome || "success").toLowerCase();
              let badgeClass = "badge-success";
              if (status === "failure" || status === "fail") badgeClass = "badge-fail";
              else if (status === "partial") badgeClass = "badge-partial";

              const timeStr = p.timestamp ? new Date(p.timestamp).toLocaleTimeString() : "";
              const comp = p.component || p.agent || "system";
              const version = p.version ? `v${p.version}` : "";

              return `
                <div class="timeline-item">
                  <div class="timeline-stage">
                    <span>${escapeHtml(stage)}</span>
                    <span class="badge ${badgeClass}">${escapeHtml(status)}</span>
                  </div>
                  <div class="timeline-comp">${escapeHtml(comp)} ${escapeHtml(version)}</div>
                  <div class="timeline-meta">${escapeHtml(timeStr)}</div>
                </div>
              `;
            }).join("")}
          </div>
        `;
      }

      // 2. Raw Log & Integrity
      const rawPayload = event.raw?.immutable_payload || event.raw?.payload || "";
      const integrityHash = event.raw?.integrity_hash || "N/A";

      // 3. Parsed Fields
      const parsed = event.parsed || {};
      const parsedFields = flattenObject(parsed.fields || {});
      const parsedKeys = Object.keys(parsedFields);

      let parsedFieldsHtml = "";
      if (parsedKeys.length === 0) {
        parsedFieldsHtml = `<div style="color:var(--text-muted); font-size:0.82rem;">No parsed fields available.</div>`;
      } else {
        parsedFieldsHtml = `
          <table class="data-table">
            <thead>
              <tr><th>Field</th><th>Value</th></tr>
            </thead>
            <tbody>
              ${parsedKeys.map(k => `
                <tr>
                  <td class="font-mono" style="color:var(--text-secondary); font-weight:500;">${escapeHtml(k)}</td>
                  <td class="font-mono">${escapeHtml(typeof parsedFields[k] === 'object' ? JSON.stringify(parsedFields[k]) : parsedFields[k])}</td>
                </tr>
              `).join("")}
            </tbody>
          </table>
        `;
      }

      // 4. Normalized Fields
      const normalized = flattenObject(event.normalized || {});
      const normKeys = Object.keys(normalized);

      let normalizedFieldsHtml = "";
      if (normKeys.length === 0) {
        normalizedFieldsHtml = `<div style="color:var(--text-muted); font-size:0.82rem;">No normalized fields available.</div>`;
      } else {
        normalizedFieldsHtml = `
          <table class="data-table">
            <thead>
              <tr><th>Normalized Field</th><th>Value</th></tr>
            </thead>
            <tbody>
              ${normKeys.map(k => `
                <tr>
                  <td class="font-mono" style="color:var(--text-secondary); font-weight:500;">${escapeHtml(k)}</td>
                  <td class="font-mono">${escapeHtml(typeof normalized[k] === 'object' ? JSON.stringify(normalized[k]) : normalized[k])}</td>
                </tr>
              `).join("")}
            </tbody>
          </table>
        `;
      }

      // 5. Field Lineage
      const lineageObj = event.field_lineage || {};
      const lineageKeys = Object.keys(lineageObj);

      let lineageHtml = "";
      if (lineageKeys.length === 0) {
        lineageHtml = `<div style="color:var(--text-muted); font-size:0.82rem;">No field lineage recorded.</div>`;
      } else {
        lineageHtml = `
          <div class="data-table-container">
            <table class="data-table">
              <thead>
                <tr>
                  <th>Normalized Field</th>
                  <th>Value</th>
                  <th>Raw Fragment</th>
                  <th>Extraction Regex</th>
                  <th>Mapping Rule</th>
                  <th>Parser</th>
                </tr>
              </thead>
              <tbody>
                ${lineageKeys.map(key => {
                  const item = lineageObj[key] || {};
                  const val = normalized[key] !== undefined ? normalized[key] : (item.value !== undefined ? item.value : "");
                  const rawFrag = item.raw_fragment || "";
                  const regex = item.extraction_rule || item.regex || "-";
                  const mapping = item.mapping_rule || item.rule || "-";
                  const parserStr = item.parser ? `${item.parser}${item.parser_version ? ' v' + item.parser_version : ''}` : "-";

                  return `
                    <tr class="lineage-row clickable" onclick="selectLineageRow(this, ${JSON.stringify(rawFrag)})">
                      <td class="font-mono" style="color:var(--text-primary); font-weight:600;">${escapeHtml(key)}</td>
                      <td class="font-mono" style="color:var(--status-success-text);">${escapeHtml(typeof val === 'object' ? JSON.stringify(val) : val)}</td>
                      <td class="font-mono" style="color:var(--status-partial-text);">${escapeHtml(rawFrag || "-")}</td>
                      <td class="font-mono" style="color:var(--text-muted); font-size:0.78rem;">${escapeHtml(regex)}</td>
                      <td class="font-mono" style="color:var(--text-secondary); font-size:0.78rem;">${escapeHtml(mapping)}</td>
                      <td class="font-mono" style="color:var(--text-muted);">${escapeHtml(parserStr)}</td>
                    </tr>
                  `;
                }).join("")}
              </tbody>
            </table>
          </div>
        `;
      }

      // 6. Source Resolution
      const sourceObj = event.source || {};
      const confidence = sourceObj.resolution_confidence !== undefined ? sourceObj.resolution_confidence : "N/A";
      const method = sourceObj.resolution_method || "N/A";
      const evidence = sourceObj.resolution_evidence;

      let evidenceHtml = "";
      if (!evidence || (typeof evidence === "object" && Object.keys(evidence).length === 0)) {
        evidenceHtml = `<span style="color:var(--text-muted)">None recorded</span>`;
      } else if (typeof evidence === "object") {
        evidenceHtml = `<pre class="font-mono" style="font-size:0.78rem; background:var(--bg-code); padding:0.5rem; border-radius:4px; margin-top:0.3rem; overflow-x:auto;">${escapeHtml(JSON.stringify(evidence, null, 2))}</pre>`;
      } else {
        evidenceHtml = `<span class="font-mono">${escapeHtml(String(evidence))}</span>`;
      }

      main.innerHTML = `
        <!-- Provenance Timeline Card -->
        <section class="card">
          <div class="card-header">
            <span class="card-title">Pipeline Provenance Timeline</span>
            <span class="badge badge-neutral">${provenance.length} Stages</span>
          </div>
          <div class="card-body">
            ${provenanceHtml}
          </div>
        </section>

        <!-- Raw Log Payload Card -->
        <section class="card">
          <div class="card-header">
            <span class="card-title">RAW LOG</span>
            <div style="display:flex; align-items:center; gap:0.6rem;">
              <span id="lineage-status"></span>
            </div>
          </div>
          <div class="card-body" style="display:flex; flex-direction:column; gap:0.75rem;">
            <pre class="code-box" id="raw-log-code">${escapeHtml(rawPayload)}</pre>
          </div>
        </section>

        <!-- Parsed & Normalized Fields Side-by-Side -->
        <div class="grid-2">
          <!-- Parsed Fields Card -->
          <section class="card">
            <div class="card-header">
              <span class="card-title">Parsed Fields</span>
              <span class="badge badge-neutral">${parsed.parser_id || 'Unknown Parser'}</span>
            </div>
            <div class="card-body" style="display:flex; flex-direction:column; gap:0.85rem;">
              <div class="key-val-grid">
                <span class="key-label">Parser ID:</span>
                <span class="val-content font-mono">${escapeHtml(parsed.parser_id || "N/A")}</span>
                <span class="key-label">Parser Version:</span>
                <span class="val-content font-mono">${escapeHtml(parsed.parser_version || "N/A")}</span>
                <span class="key-label">Validation Status:</span>
                <span class="val-content">
                  <span class="badge ${parsed.validation_status === 'PASS' ? 'badge-success' : parsed.validation_status === 'FAIL' ? 'badge-fail' : 'badge-partial'}">
                    ${escapeHtml(parsed.validation_status || "N/A")}
                  </span>
                </span>
              </div>
              <div style="border-top:1px solid var(--border-subtle); padding-top:0.75rem;">
                ${parsedFieldsHtml}
              </div>
            </div>
          </section>

          <!-- Normalized Fields Card -->
          <section class="card">
            <div class="card-header">
              <span class="card-title">Normalized Schema Fields</span>
              <span class="badge badge-neutral">${normKeys.length} Fields</span>
            </div>
            <div class="card-body">
              ${normalizedFieldsHtml}
            </div>
          </section>
        </div>

        <!-- Field Lineage Card -->
        <section class="card">
          <div class="card-header">
            <span class="card-title">Field Lineage & Mapping Rules</span>
            <span style="font-size:0.75rem; color:var(--text-muted)">Click any row to highlight fragment in raw log</span>
          </div>
          <div class="card-body">
            ${lineageHtml}
          </div>
        </section>

        <!-- Source Resolution Card -->
        <section class="card">
          <div class="card-header">
            <span class="card-title">Source Resolution Analysis</span>
            <span class="badge badge-neutral">${escapeHtml(sourceObj.type || 'Source')}</span>
          </div>
          <div class="card-body">
            <div class="key-val-grid">
              <span class="key-label">Parser / Source:</span>
              <span class="val-content font-mono">${escapeHtml(sourceObj.type || "N/A")}</span>
              <span class="key-label">Resolution Method:</span>
              <span class="val-content font-mono">${escapeHtml(method)}</span>
              <span class="key-label">Confidence Score:</span>
              <span class="val-content font-mono" style="color:var(--status-success-text); font-weight:600;">
                ${typeof confidence === 'number' ? (confidence * 100).toFixed(1) + '%' : escapeHtml(confidence)}
              </span>
              <span class="key-label">Resolution Evidence:</span>
              <span class="val-content">${evidenceHtml}</span>
            </div>
          </div>
        </section>
      `;
    }

    async function initPage() {
      const eventId = getEventIdFromUrl();
      const main = document.getElementById("app-main");

      if (!eventId) {
        main.innerHTML = `
          <div class="card state-container">
            <div class="state-title" style="color:var(--status-fail-text)">No Event ID Provided</div>
            <div class="state-desc">Please open this page with a valid event ID path, e.g., <code>/trace/&lt;event_id&gt;</code></div>
          </div>
        `;
        return;
      }

      try {
        const res = await fetch(`/api/events/${encodeURIComponent(eventId)}/full`);
        if (!res.ok) {
          if (res.status === 404) {
            main.innerHTML = `
              <div class="card state-container">
                <div class="state-title" style="color:var(--status-fail-text)">Event Not Found (HTTP 404)</div>
                <div class="state-desc">The requested event <code>${escapeHtml(eventId)}</code> was not found in the <code>loki-events</code> index.</div>
              </div>
            `;
            return;
          }
          if (res.status === 503) {
            main.innerHTML = `
              <div class="card state-container">
                <div class="state-title" style="color:var(--status-fail-text)">Elasticsearch Unavailable (HTTP 503)</div>
                <div class="state-desc">Unable to connect to Elasticsearch backend. Please verify your Elasticsearch service status.</div>
              </div>
            `;
            return;
          }
          const errData = await res.json().catch(() => ({}));
          throw new Error(errData.error || `HTTP ${res.status}`);
        }

        const event = await res.json();
        renderEventTrace(event);
      } catch (err) {
        main.innerHTML = `
          <div class="card state-container">
            <div class="state-title" style="color:var(--status-fail-text)">Failed to Load Event Trace</div>
            <div class="state-desc">${escapeHtml(err.message)}</div>
          </div>
        `;
      }
    }

    window.addEventListener("DOMContentLoaded", initPage);
  </script>
</body>
</html>
